<div *ngIf="articles$ | async as articles">
  <h4 *ngIf="articles.length === 0">
    Let's create your first article
    <span
      routerLink="/editor"
      [ngStyle]="{ cursor: 'pointer', 'font-weight': '900' }"
    >
      &rarr;
    </span>
  </h4>
</div>
<app-articles-item
  *ngFor="let article of articles$ | async"
  [article]="article"
/>

<ul class="pagination">
  <li
    *ngFor="let PageOffset of pagination$ | async; index as i"
    class="page-item active"
    [ngClass]="{ active: PageOffset == articleParams?.offset }"
  >
    <a class="page-link" (click)="onSetOffset(PageOffset)">{{ i + 1 }}</a>
  </li>
</ul>
