<div class="profile-page">
  <div class="user-info">
    <div class="container">
      <div class="row">
        <div class="col-xs-12 col-md-10 offset-md-1">
          <img [src]="profile.profileDetails?.image" class="user-img" />
          <h4>{{ profile.profileDetails.username }}</h4>
          <p>{{ profile.profileDetails.bio }}</p>
          @if ( profile.isMyProfile ) {

          <button
            [routerLink]="'/settings'"
            class="btn btn-sm btn-outline-secondary action-btn"
          >
            <i class="ion-gear-a"></i>
            &nbsp; Edit Profile Settings
          </button>
          }@else {

          <button
            (click)="onFollow()"
            [class]="
              'btn btn-sm ' +
              (profile.profileDetails.following
                ? 'btn-secondary'
                : 'btn-primary')
            "
          >
            @if(profile.profileDetails.following){ Unfollow }@else { Follow }

            {{ profile.profileDetails.username }}
          </button>
          }
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-md-9">
        <div class="feed-toggle">
          <ul class="nav nav-pills outline-active">
            <li class="nav-item">
              <a
                class="nav-link"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                [routerLink]="['/profile', profile.profileDetails.username]"
                [queryParams]="{ favorited: true }"
                >Favorited Articles</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                [routerLink]="['/profile', profile.profileDetails.username]"
                >My Articles</a
              >
            </li>
          </ul>
        </div>
        <app-articles-list></app-articles-list>
      </div>
    </div>
  </div>
</div>
