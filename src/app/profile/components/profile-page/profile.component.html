<div class="profile-page">
  <div class="user-info">
    <div class="container">
      <div class="row">
        <div class="col-xs-12 col-md-10 offset-md-1">
          <img [src]="profile.profileDetails.profile.image" class="user-img" />
          <h4>{{ profile.profileDetails.profile.username }}</h4>
          <p>{{ profile.profileDetails.profile.bio }}</p>
          @if ( profile.isMyProfile ) {

          <button
            [routerLink]="'/settings'"
            class="btn btn-sm btn-outline-secondary action-btn"
          >
            <i class="ion-gear-a"></i>
            &nbsp; Edit Profile Settings
          </button>
          }@else {

          <button class="btn btn-sm btn-outline-secondary action-btn">
            <i class="ion-plus-round"></i>
            &nbsp; Follow {{ profile.profileDetails.profile.username }}
          </button>
          }
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-md-9">
        <div class="feed-toggle">
          <ul class="nav nav-pills outline-active">
            <li class="nav-item">
              <a
                class="nav-link"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                [routerLink]="[
                  '/profile',
                  profile.profileDetails.profile.username
                ]"
                [queryParams]="{ favorited: true }"
                >Favorited Articles</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                [routerLink]="[
                  '/profile',
                  profile.profileDetails.profile.username
                ]"
                >My Articles</a
              >
            </li>
          </ul>
        </div>
        <h4 *ngIf="articles.length === 0">No Available Articles!</h4>
        <app-articles-item
          *ngFor="let article of articles"
          [article]="article"
        />

        <ul class="pagination">
          <li
            *ngFor="let PageOffset of pagination; index as i"
            class="page-item active"
            [ngClass]="{ active: PageOffset == offset }"
          >
            <a class="page-link" (click)="onSetOffset(PageOffset)">{{
              i + 1
            }}</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
